[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindseye"
version = "1.0.0"
description = "Grounded hallucination detection for world-model imagination (research code)"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy==2.5.4",
    "pyyaml==6.0.3",
    "pillow==11.3.0",
]

# Exact GPU environments of the Kaggle runs are in requirements/kaggle.txt.
[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0", "black==26.10.1"]
figures = ["matplotlib==3.11.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["scripts/probes"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
extend-exclude = "scripts/probes"

