# Frame-count sweep at one resolution (448 x 448 pixel budget per frame) for all K.
# 16 frames at 640 x 480 ran out of memory on a T4.
name: p2_vlm_only_vsi_sub200_sparse8_448_qwen8b_v1
seed: 0
data:
  benchmark: vsibench
  split: dev
  split_file: data/splits/vsibench.json
  jsonl: cache/hf/VSI-Bench/test.jsonl
  video_root: cache/vsibench_videos
  id_file: data/splits/imagine_subset.json
  id_key: vsi_ids
view:
  mode: sparse
  n_observed: 8
  n_heldout: 8
vlm:
  backend: qwen_local
  model_id: Qwen/Qwen3-VL-8B-Instruct
  dtype: float16
  max_pixels: 200704
generation:
  max_tokens: 16
  temperature: 0.0
