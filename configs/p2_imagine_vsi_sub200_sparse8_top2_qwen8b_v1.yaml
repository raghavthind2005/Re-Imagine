# Variant of p2_imagine_vsi_sub200_sparse8_qwen8b_v1: always keeps the 2 most helpful views (threshold 0).
# Same renders and view scores (cached); only the evidence passed to the final answer differs.
# imagine mode (MindJourney-style search with Stable Virtual Camera) on the fixed
# 200-question subset, 8 observed frames. Paired baseline:
# p2_vlm_only_vsi_sub200_sparse8_448_qwen8b_v1 (same frames, same pixel budget).
name: p2_imagine_vsi_sub200_sparse8_top2_qwen8b_v1
seed: 0
data:
  benchmark: vsibench
  split: dev
  split_file: data/splits/vsibench.json
  jsonl: cache/hf/VSI-Bench/test.jsonl
  video_root: cache/vsibench_videos
  id_file: data/splits/imagine_subset.json
  id_key: vsi_ids
view:
  mode: sparse
  n_observed: 8
  n_heldout: 8
vlm:
  backend: qwen_local
  model_id: Qwen/Qwen3-VL-8B-Instruct
  dtype: float16
  max_pixels: 200704
generation:
  max_tokens: 16
  temperature: 0.0
imagine:
  # One search step: 3 actions x up to 3 repeats = 9 candidate views, one SVC pass.
  n_steps: 1
  max_repeat: 3
  beam_width: 2
  n_helpful: 2
  max_evidence: 2
  explore_threshold: 8.0
  helpful_threshold: 0.0
  turn_deg: 9.0
  # MindJourney's 0.25 m step as a share of the start view's median depth (the
  # reconstruction has no metric scale; 0.125 assumes a median depth near 2 m).
  forward_depth_fraction: 0.125
  forward_label_m: 0.25
svc: {}
